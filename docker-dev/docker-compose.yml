name: mc_cockpit_dev

services:
  php:
    build: .
    container_name: mc_cockpit_php
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html:cached
      - ./php-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    environment:
      DATABASE_URL: "postgresql://cockpit:cockpit@db:5432/cockpit?serverVersion=16&charset=utf8"
      MEILI_HOST: "http://meili:7700"
      MEILI_KEY: "devmasterkey"
    depends_on:
      db:
        condition: service_healthy

  # Hintergrund-Abruf: synchronisiert die Postfächer regelmäßig (ohne Triage).
  mailsync:
    build: .
    container_name: mc_cockpit_mailsync
    working_dir: /var/www/html
    command: sh -c "sleep 12; while true; do php bin/console app:fetch-mail --since-days=3 --limit=40 >/dev/null 2>&1 || true; sleep 90; done"
    volumes:
      - ../backend:/var/www/html:cached
      - ./php-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    environment:
      DATABASE_URL: "postgresql://cockpit:cockpit@db:5432/cockpit?serverVersion=16&charset=utf8"
      MEILI_HOST: "http://meili:7700"
      MEILI_KEY: "devmasterkey"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    container_name: mc_cockpit_nginx
    ports:
      - "8090:80"
    volumes:
      - ../backend:/var/www/html:cached
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: postgres:16
    container_name: mc_cockpit_db
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: cockpit
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 3s
      retries: 20

  meili:
    image: getmeili/meilisearch:v1.11
    container_name: mc_cockpit_meili
    environment:
      MEILI_MASTER_KEY: devmasterkey
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  db_data:
  meili_data:
