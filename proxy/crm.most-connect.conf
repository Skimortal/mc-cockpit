# Reverse-Proxy-Konfiguration für crm.most-connect.com -> MOST Connect Cockpit
# Installation auf dem Server (quigon):
#   cp proxy/crm.most-connect.conf /proxy/nginx/conf.d/crm.most-connect.conf
#   docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
# TLS: Wildcard-Zertifikat *.most-connect.com ist bereits vorhanden.

upstream cockpit_upstream {
    zone cockpit_zone 64k;
    server mc_cockpit_web:80 resolve;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name crm.most-connect.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name crm.most-connect.com;

    ssl_certificate     /etc/nginx/certs/most-connect.com.pem;
    ssl_certificate_key /etc/nginx/certs/most-connect.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    location / {
        proxy_pass http://cockpit_upstream;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    access_log  /var/log/nginx/crm.most-connect.access.log;
    error_log   /var/log/nginx/crm.most-connect.error.log;
}
